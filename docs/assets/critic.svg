<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <radialGradient id="crit-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#192338" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="crit-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0e1524" stop-opacity="0.95"/>
    </linearGradient>
    <marker id="arrow-crit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber-crit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#fbbf24"/>
    </marker>
    <filter id="shadow-crit" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="960" height="470" fill="url(#crit-bg)"/>

  <!-- Top Pill Header -->
  <g transform="translate(40, 20)">
    <rect width="260" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
    <circle cx="14" cy="14" r="5" fill="#34d399"/>
    <text x="28" y="18" fill="#f8fafc" font-size="11" font-weight="700" letter-spacing="1">AUTOMATED AI CRITIC</text>
    <text x="320" y="19" fill="#94a3b8" font-size="12">8-Point Policy Verification &amp; Deterministic Compliance Engine</text>
  </g>

  <!-- Step 1: Input Raw Scene Plan -->
  <g transform="translate(40, 65)" filter="url(#shadow-crit)">
    <rect width="180" height="195" rx="10" fill="url(#crit-surface)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="14" y="14" width="75" height="20" rx="10" fill="#0369a1"/>
    <text x="22" y="27" fill="#ffffff" font-size="9" font-weight="800">INPUT</text>
    <text x="14" y="58" fill="#38bdf8" font-size="13" font-weight="700">Raw Scene Plan</text>
    <text x="14" y="80" fill="#94a3b8" font-size="11">• JSON Script Array</text>
    <text x="14" y="98" fill="#94a3b8" font-size="11">• Visual Prompts</text>
    <text x="14" y="116" fill="#94a3b8" font-size="11">• Voice Persona Tone</text>
    <text x="14" y="134" fill="#94a3b8" font-size="11">• Regional Narration</text>
    <text x="14" y="152" fill="#94a3b8" font-size="11">• On-Screen Banners</text>
    <text x="14" y="170" fill="#94a3b8" font-size="11">• Audio Padding Limits</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g>
    <path d="M 220 162 L 250 162" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-crit)"/>
  </g>

  <!-- Step 2: 8-Point Auditor Card (2 Columns) -->
  <g transform="translate(250, 60)" filter="url(#shadow-crit)">
    <rect width="460" height="205" rx="10" fill="url(#crit-surface)" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="16" y="14" width="180" height="20" rx="10" fill="#4338ca"/>
    <text x="24" y="27" fill="#ffffff" font-size="9" font-weight="800">8-POINT AUDIT RUBRIC</text>
    
    <!-- Column 1 (Left 4 checks) -->
    <g transform="translate(16, 44)">
      <text x="0" y="16" fill="#38bdf8" font-size="10" font-weight="700">[1] Regional Grounding</text>
      <text x="0" y="29" fill="#94a3b8" font-size="10">Authentic regional B-roll cues</text>

      <text x="0" y="52" fill="#c084fc" font-size="10" font-weight="700">[2] Lip-Sync Elimination</text>
      <text x="0" y="65" fill="#94a3b8" font-size="10">B-roll only; zero talking faces</text>

      <text x="0" y="88" fill="#34d399" font-size="10" font-weight="700">[3] Audio-Visual Pacing</text>
      <text x="0" y="101" fill="#94a3b8" font-size="10">≥1.0s lead-in, ≥1.5s trail buffer</text>

      <text x="0" y="124" fill="#fbbf24" font-size="10" font-weight="700">[4] Policy Fact Check</text>
      <text x="0" y="137" fill="#94a3b8" font-size="10">Benefits, eligibility &amp; deadlines</text>
    </g>

    <!-- Column 2 (Right 4 checks) -->
    <g transform="translate(235, 44)">
      <text x="0" y="16" fill="#fb7185" font-size="10" font-weight="700">[5] Public Service Tone</text>
      <text x="0" y="29" fill="#94a3b8" font-size="10">Inspiring, dignified citizen voice</text>

      <text x="0" y="52" fill="#38bdf8" font-size="10" font-weight="700">[6] Scene Count Retention</text>
      <text x="0" y="65" fill="#94a3b8" font-size="10">Exact N scenes without loss</text>

      <text x="0" y="88" fill="#c084fc" font-size="10" font-weight="700">[7] Multi-Section Structure</text>
      <text x="0" y="101" fill="#94a3b8" font-size="10">Full prompt blocks &amp; zero bleed</text>

      <text x="0" y="124" fill="#34d399" font-size="10" font-weight="700">[8] English On-Screen Text</text>
      <text x="0" y="137" fill="#94a3b8" font-size="10">Diffusion-legible Latin banners</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g>
    <path d="M 710 162 L 740 162" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow-crit)"/>
  </g>

  <!-- Step 3: Compliance Score -->
  <g transform="translate(740, 65)" filter="url(#shadow-crit)">
    <rect width="180" height="195" rx="10" fill="url(#crit-surface)" stroke="#34d399" stroke-width="1.5"/>
    <rect x="14" y="14" width="105" height="20" rx="10" fill="#047857"/>
    <text x="22" y="27" fill="#ffffff" font-size="9" font-weight="800">SCORING ENGINE</text>
    
    <text x="14" y="65" fill="#f8fafc" font-size="12" font-weight="700">Compliance Score</text>
    <text x="14" y="105" fill="#34d399" font-size="32" font-weight="800">0 – 100</text>
    <rect x="14" y="125" width="152" height="24" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="22" y="141" fill="#34d399" font-size="10" font-weight="700">Pass Threshold: ≥ 90</text>
    <text x="14" y="172" fill="#94a3b8" font-size="10">Deterministic pass/fail gate</text>
  </g>

  <!-- Branching Arrows Downward -->
  <!-- Left Branch: Score >= 90 (Pass) -->
  <g>
    <path d="M 780 260 L 780 290 L 520 290 L 520 325" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <rect x="540" y="280" width="135" height="20" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
    <text x="550" y="294" fill="#34d399" font-size="10" font-weight="700">Score ≥ 90 (Approved)</text>
  </g>

  <!-- Right Branch: Score < 90 (Auto-Remediate) -->
  <g>
    <path d="M 870 260 L 870 325" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrow-amber-crit)"/>
    <rect x="800" y="280" width="120" height="20" rx="10" fill="#451a03" stroke="#fbbf24" stroke-width="1"/>
    <text x="810" y="294" fill="#fbbf24" font-size="10" font-weight="700">Score &lt; 90 (Review)</text>
  </g>

  <!-- Outcome 1: Locked & Ready -->
  <g transform="translate(360, 335)" filter="url(#shadow-crit)">
    <rect width="320" height="95" rx="10" fill="#0b2e24" stroke="#34d399" stroke-width="1.5"/>
    <text x="16" y="28" fill="#34d399" font-size="13" font-weight="700">✅ Storyboard Locked &amp; Production-Ready</text>
    <text x="16" y="50" fill="#f8fafc" font-size="11">Passed all 8 compliance verification standards.</text>
    <text x="16" y="70" fill="#94a3b8" font-size="11">Dispatched to Gemini Omni / Video Synthesis Cluster.</text>
  </g>

  <!-- Outcome 2: Remediation Issues Logged -->
  <g transform="translate(710, 335)" filter="url(#shadow-crit)">
    <rect width="210" height="95" rx="10" fill="#2d1c08" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="14" y="28" fill="#fbbf24" font-size="13" font-weight="700">⚠️ Auto-Remediation</text>
    <text x="14" y="50" fill="#f8fafc" font-size="11">Structured CriticIssues</text>
    <text x="14" y="70" fill="#94a3b8" font-size="11">logged with 1-click auto-fix.</text>
  </g>
</svg>

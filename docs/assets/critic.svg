<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <radialGradient id="crit-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#192338" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="crit-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0e1524" stop-opacity="0.95"/>
    </linearGradient>
    <marker id="arrow-crit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber-crit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#fbbf24"/>
    </marker>
    <filter id="shadow-crit" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="900" height="400" fill="url(#crit-bg)"/>

  <!-- Top Pill -->
  <g transform="translate(40, 20)">
    <rect width="260" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
    <circle cx="14" cy="14" r="5" fill="#34d399"/>
    <text x="28" y="18" fill="#f8fafc" font-size="11" font-weight="700" letter-spacing="1">AUTOMATED AI CRITIC</text>
    <text x="320" y="19" fill="#94a3b8" font-size="12">5-Point Policy Verification &amp; Deterministic Compliance Engine</text>
  </g>

  <!-- Step 1: Input Raw Scene Plan -->
  <g transform="translate(40, 70)" filter="url(#shadow-crit)">
    <rect width="180" height="150" rx="10" fill="url(#crit-surface)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="14" y="14" width="75" height="20" rx="10" fill="#0369a1"/>
    <text x="22" y="27" fill="#ffffff" font-size="9" font-weight="800">INPUT</text>
    <text x="14" y="58" fill="#38bdf8" font-size="13" font-weight="700">Raw Scene Plan</text>
    <text x="14" y="78" fill="#94a3b8" font-size="11">• JSON Script Array</text>
    <text x="14" y="96" fill="#94a3b8" font-size="11">• Visual Prompts</text>
    <text x="14" y="114" fill="#94a3b8" font-size="11">• Bengali Voiceover</text>
    <text x="14" y="132" fill="#94a3b8" font-size="11">• Audio Padding</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g>
    <path d="M 220 145 L 255 145" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-crit)"/>
  </g>

  <!-- Step 2: 5-Point Auditor -->
  <g transform="translate(260, 60)" filter="url(#shadow-crit)">
    <rect width="360" height="170" rx="10" fill="url(#crit-surface)" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="16" y="14" width="160" height="20" rx="10" fill="#4338ca"/>
    <text x="24" y="27" fill="#ffffff" font-size="9" font-weight="800">5-POINT AUDIT RUBRIC</text>
    
    <g transform="translate(16, 44)">
      <text x="0" y="16" fill="#38bdf8" font-size="11" font-weight="700">[1] Regional Grounding:</text>
      <text x="150" y="16" fill="#94a3b8" font-size="11">Authentic regional B-roll cues</text>

      <text x="0" y="38" fill="#c084fc" font-size="11" font-weight="700">[2] Lip-Sync Elimination:</text>
      <text x="150" y="38" fill="#94a3b8" font-size="11">B-roll only; zero talking heads</text>

      <text x="0" y="60" fill="#34d399" font-size="11" font-weight="700">[3] Audio-Visual Pacing:</text>
      <text x="150" y="60" fill="#94a3b8" font-size="11">≥1s lead-in, ≥1.5s trail buffer</text>

      <text x="0" y="82" fill="#fbbf24" font-size="11" font-weight="700">[4] Policy Fact Check:</text>
      <text x="150" y="82" fill="#94a3b8" font-size="11">Cross-check benefits &amp; portals</text>

      <text x="0" y="104" fill="#fb7185" font-size="11" font-weight="700">[5] Public Service Tone:</text>
      <text x="150" y="104" fill="#94a3b8" font-size="11">Inspiring citizen-first framing</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g>
    <path d="M 620 145 L 655 145" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow-crit)"/>
  </g>

  <!-- Step 3: Compliance Score -->
  <g transform="translate(660, 70)" filter="url(#shadow-crit)">
    <rect width="200" height="150" rx="10" fill="url(#crit-surface)" stroke="#34d399" stroke-width="1.5"/>
    <rect x="14" y="14" width="105" height="20" rx="10" fill="#047857"/>
    <text x="22" y="27" fill="#ffffff" font-size="9" font-weight="800">SCORING ENGINE</text>
    
    <text x="14" y="65" fill="#f8fafc" font-size="12" font-weight="700">Compliance Score</text>
    <text x="14" y="95" fill="#34d399" font-size="28" font-weight="800">0 – 100</text>
    <text x="14" y="125" fill="#94a3b8" font-size="11">Pass Threshold: ≥ 80</text>
  </g>

  <!-- Branching Arrows Downward -->
  <!-- Left Branch: Score >= 80 (Pass) -->
  <g>
    <path d="M 720 220 L 720 250 L 520 250 L 520 280" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <rect x="540" y="240" width="130" height="20" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
    <text x="550" y="254" fill="#34d399" font-size="10" font-weight="700">Score ≥ 80 (Approved)</text>
  </g>

  <!-- Right Branch: Score < 80 (Auto-Remediate) -->
  <g>
    <path d="M 800 220 L 800 280" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrow-amber-crit)"/>
    <rect x="740" y="240" width="125" height="20" rx="10" fill="#451a03" stroke="#fbbf24" stroke-width="1"/>
    <text x="750" y="254" fill="#fbbf24" font-size="10" font-weight="700">Score &lt; 80 (Review)</text>
  </g>

  <!-- Outcome 1: Locked & Ready -->
  <g transform="translate(380, 290)" filter="url(#shadow-crit)">
    <rect width="280" height="90" rx="10" fill="#0b2e24" stroke="#34d399" stroke-width="1.5"/>
    <text x="16" y="28" fill="#34d399" font-size="14" font-weight="700">✅ Storyboard Locked &amp; Approved</text>
    <text x="16" y="50" fill="#f8fafc" font-size="11">Passed compliance verification.</text>
    <text x="16" y="70" fill="#94a3b8" font-size="11">Dispatched to Video Synthesis Cluster.</text>
  </g>

  <!-- Outcome 2: Remediation Issues Logged -->
  <g transform="translate(680, 290)" filter="url(#shadow-crit)">
    <rect width="180" height="90" rx="10" fill="#2d1c08" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="14" y="28" fill="#fbbf24" font-size="13" font-weight="700">⚠️ Auto-Remediation</text>
    <text x="14" y="50" fill="#f8fafc" font-size="11">Specific CriticIssues</text>
    <text x="14" y="70" fill="#94a3b8" font-size="11">logged for 1-click fix.</text>
  </g>
</svg>

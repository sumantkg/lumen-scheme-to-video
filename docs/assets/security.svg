<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <radialGradient id="sec-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#19253d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="sec-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0e1524" stop-opacity="0.95"/>
    </linearGradient>
    <marker id="sec-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#38bdf8"/>
    </marker>
    <marker id="sec-arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#34d399"/>
    </marker>
    <filter id="sec-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="960" height="380" fill="url(#sec-bg)"/>

  <!-- Top Header -->
  <g transform="translate(40, 20)">
    <rect width="270" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="14" cy="14" r="5" fill="#38bdf8"/>
    <text x="28" y="18" fill="#f8fafc" font-size="11" font-weight="700" letter-spacing="1">ENCRYPTED KEY VAULT</text>
    <text x="330" y="19" fill="#94a3b8" font-size="12">Authenticated AES-256-GCM Envelope Encryption Flow</text>
  </g>

  <!-- Box 1: Plaintext Input -->
  <g transform="translate(40, 75)" filter="url(#sec-shadow)">
    <rect width="210" height="150" rx="10" fill="url(#sec-card)" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="14" y="14" width="100" height="20" rx="10" fill="#991b1b"/>
    <text x="22" y="27" fill="#ffffff" font-size="9" font-weight="800">CLIENT INPUT</text>
    
    <text x="14" y="60" fill="#f87171" font-size="13" font-weight="700">Plaintext API Key</text>
    <text x="14" y="80" fill="#94a3b8" font-size="11">Google AI / OpenAI Key</text>
    <text x="14" y="98" fill="#94a3b8" font-size="11">Never logged to disk</text>
    <text x="14" y="116" fill="#94a3b8" font-size="11">Ephemeral memory only</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g>
    <path d="M 250 150 L 300 150" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#sec-arrow)"/>
  </g>

  <!-- Box 2: Encryption Engine -->
  <g transform="translate(300, 65)" filter="url(#sec-shadow)">
    <rect width="330" height="170" rx="10" fill="url(#sec-card)" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="14" y="14" width="170" height="20" rx="10" fill="#4338ca"/>
    <text x="22" y="27" fill="#ffffff" font-size="9" font-weight="800">AES-256-GCM ENGINE</text>

    <text x="14" y="60" fill="#818cf8" font-size="13" font-weight="700">lib/crypto/secretbox.ts</text>
    <text x="14" y="82" fill="#f8fafc" font-size="11">• Master Key: <tspan fill="#38bdf8">32-Byte Secret</tspan></text>
    <text x="14" y="100" fill="#f8fafc" font-size="11">• Crypto Nonce: <tspan fill="#c084fc">12-Byte Random IV</tspan></text>
    <text x="14" y="118" fill="#f8fafc" font-size="11">• Auth Tag: <tspan fill="#34d399">16-Byte Tamper Check</tspan></text>
    <text x="14" y="138" fill="#94a3b8" font-size="10">Guarantees both confidentiality &amp; authenticity</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g>
    <path d="M 630 150 L 680 150" stroke="#818cf8" stroke-width="2.5" marker-end="url(#sec-arrow)"/>
  </g>

  <!-- Box 3: Stored Vault State -->
  <g transform="translate(680, 75)" filter="url(#sec-shadow)">
    <rect width="240" height="150" rx="10" fill="url(#sec-card)" stroke="#34d399" stroke-width="1.5"/>
    <rect x="14" y="14" width="120" height="20" rx="10" fill="#047857"/>
    <text x="22" y="27" fill="#ffffff" font-size="9" font-weight="800">CIPHERTEXT STORE</text>
    
    <text x="14" y="60" fill="#34d399" font-size="13" font-weight="700">SQLite Database</text>
    <text x="14" y="80" fill="#94a3b8" font-size="11">encryptedKey: <tspan fill="#64748b">k9JzL7...</tspan></text>
    <text x="14" y="98" fill="#94a3b8" font-size="11">iv: <tspan fill="#64748b">4a8f9c1e...</tspan></text>
    <text x="14" y="116" fill="#94a3b8" font-size="11">authTag: <tspan fill="#64748b">d301ae9f...</tspan></text>
    <text x="14" y="136" fill="#38bdf8" font-size="11" font-weight="600">Client Mask: ••••••••ab12</text>
  </g>

  <!-- Bottom Row: Decryption Flow for Background Worker -->
  <g transform="translate(40, 265)">
    <rect width="880" height="85" rx="8" fill="#131c2e" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="24" r="5" fill="#34d399"/>
    <text x="35" y="28" fill="#f8fafc" font-size="12" font-weight="700">Ephemeral In-Memory Decryption during Worker Tasks</text>
    <text x="35" y="48" fill="#94a3b8" font-size="11">When <tspan fill="#38bdf8">worker.ts</tspan> executes an AI synthesis task, it fetches the ciphertext from SQLite, authenticates the 16-byte tag with the server master key, and holds the plaintext key in local scope only for the duration of the HTTP fetch call.</text>
    <text x="35" y="68" fill="#34d399" font-size="11">✓ Zero disk writes • CSP frame-ancestors 'self' prevents clickjacking attacks</text>
  </g>
</svg>
